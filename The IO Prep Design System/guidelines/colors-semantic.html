<!-- @dsCard group="Colors" viewport="700x150" name="Semantic" subtitle="Muted \u2014 no bright saturated states" -->
<link rel="stylesheet" href="../styles.css">
<div style="display:flex;gap:12px;height:150px;padding:14px;box-sizing:border-box;font-family:var(--font-serif);background:var(--white)">
<div style="flex:1;background:var(--success-bg);color:var(--success);border:1px solid var(--success);border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;font-size:14px">Success</div>
<div style="flex:1;background:var(--error-bg);color:var(--error);border:1px solid var(--error);border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;font-size:14px">Error</div>
<div style="flex:1;background:var(--warning-bg);color:var(--warning);border:1px solid var(--warning);border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;font-size:14px">Warning</div>
</div>
