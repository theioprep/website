<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<div id="root"></div>
<script type="text/babel" src="PricingCard.jsx"></script>
<script type="text/babel" src="CheckoutForm.jsx"></script>
<script type="text/babel">
function App(){
const [step,setStep]=React.useState('plans');
return (
<div style={{fontFamily:'var(--font-serif)',background:'var(--white)',minHeight:780,padding:'56px 48px'}}>
{step==='plans'?(
<div>
<div style={{font:'var(--text-h2)',color:'var(--oxford-blue)',marginBottom:8}}>Choose your plan</div>
<div style={{font:'var(--text-body)',color:'var(--text-muted)',marginBottom:40}}>Full access to every lesson, past-paper walkthrough, and marked sample essay.</div>
<div style={{display:'flex',gap:24}}>
<PricingCard plan="Single course" price="\u00a3149" features={['1 course, lifetime access','Past-paper walkthroughs','Downloadable notes']} onSelect={()=>setStep('checkout')} />
<PricingCard plan="Full bundle" price="\u00a3249" highlighted={true} features={['IGCSE + IB, lifetime access','Every past-paper walkthrough','1:1 essay feedback (2x)']} onSelect={()=>setStep('checkout')} />
</div>
</div>
):(
<CheckoutForm/>
)}
</div>);
}
setTimeout(()=>ReactDOM.createRoot(document.getElementById('root')).render(<App/>),0);
</script>
